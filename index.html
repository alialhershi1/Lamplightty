<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lamplight</title>
<style>
:root{--ink:#0b0e17;--dusk:#151a2c;--line:#262d47;--mist:#9aa5c8;--moon:#f1eee4;--glow:#8fb4ff;--rose:#e58fa8;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{min-height:100dvh;background:radial-gradient(120% 70% at 50% 0%,#1b2347 0,var(--ink) 62%) var(--ink);color:var(--moon);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.top{padding:14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border:1px solid var(--line);border-radius:99px;background:rgba(21,26,44,.6);color:var(--mist);font:500 15px/1 Georgia,"Iowan Old Style",serif;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pill b{width:7px;height:7px;border-radius:50%;background:var(--line)}
.live .pill{color:var(--moon);border-color:var(--rose)}
.live .pill b{background:var(--rose);animation:bl 1.6s ease-in-out infinite}
@keyframes bl{50%{opacity:.25}}
.wrap{width:min(440px,100%);padding:0 20px 28px;flex:1;display:flex;flex-direction:column;align-items:center;gap:20px}
.moon{position:relative;width:min(64vw,250px);aspect-ratio:1;border-radius:50%;margin-top:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 90px 12px rgba(143,180,255,.2);background:radial-gradient(circle at 35% 30%,#fbf8ee,#cfcab9 70%)}
.moon::after{content:"";position:absolute;inset:-4%;border-radius:50%;background:#10152a;transform:translate(27%,-4%);transition:opacity .6s}
.moon video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .6s;z-index:1}
.live .moon video{opacity:1}
.live .moon::after{opacity:0}
#say{min-height:1.5em;text-align:center;color:var(--mist);max-width:34ch}
.rec{width:78px;height:78px;border-radius:50%;border:2px solid var(--moon);background:none;display:grid;place-items:center;cursor:pointer}
.rec i{width:56px;height:56px;border-radius:50%;background:var(--rose);transition:all .25s}
.live .rec i{width:26px;height:26px;border-radius:7px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{display:flex;gap:8px;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:99px;color:var(--mist);cursor:pointer}
.chip input{accent-color:var(--glow);width:18px;height:18px}
.card{width:100%;background:var(--dusk);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font:600 17px/1.3 Georgia,"Iowan Old Style",serif}
summary{cursor:pointer;min-height:24px;font:600 17px/1.3 Georgia,"Iowan Old Style",serif}
details .in{display:flex;flex-direction:column;gap:12px;margin-top:12px}
label span{display:block;font-size:13px;color:var(--mist);margin-bottom:4px}
input[type=text],input[type=url],input[type=password],input[type=number]{width:100%;min-height:44px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 12px}
input[type=file]{width:100%;color:var(--mist)}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--dusk);cursor:pointer}
.btn.pri{background:var(--glow);color:#0b1230;border-color:var(--glow);font-weight:600}
.card .btn{flex:1}
.bar{height:6px;background:var(--ink);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--glow);transition:width .3s}
.small{font-size:13px;color:var(--mist)}
.nav{display:flex;gap:4px;padding:4px;margin:4px 0 10px;border:1px solid var(--line);border-radius:99px;background:rgba(21,26,44,.7)}
.nav button{min-height:40px;padding:0 22px;border:0;border-radius:99px;background:none;color:var(--mist);cursor:pointer}
.nav .on{background:var(--moon);color:var(--ink)}
#pv{width:100%;border-radius:12px;background:#000}
[hidden]{display:none!important}
#dim{position:fixed;inset:0;z-index:9;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 28px)}
.dim #dim{opacity:1;pointer-events:auto}
#dim .pill{background:none;border-color:#141830;color:#2c3454}
#dim .btn{background:none;border-color:#141830;color:#2c3454;transition:all .3s}
#dim.peek .pill,#dim.peek .btn{color:var(--moon);border-color:var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="pill" role="timer"><b></b><span id="t">00:00:00</span></div></div>

<main class="wrap">
  <nav class="nav" aria-label="Sections">
    <button class="on" data-v="recV">Record</button>
    <button data-v="lockV">Unlock</button>
  </nav>

  <section id="recV" class="wrap" style="padding:0">
    <div class="moon"><video id="cam" muted playsinline></video></div>
    <p id="say" aria-live="polite">Ready when you are.</p>
    <button class="rec" id="rec" aria-label="Start or stop recording"><i></i></button>
    <div class="row">
      <label class="chip"><input type="checkbox" id="dimOn" checked> Dim the screen</label>
      <label class="chip"><input type="checkbox" id="mic" checked> Record sound</label>
    </div>

    <div class="card" id="done" hidden>
      <h2>Session finished</h2>
      <p class="small" id="info"></p>
      <div class="bar"><i id="fill"></i></div>
      <div class="row" style="flex-wrap:nowrap">
        <button class="btn" id="save">Save video</button>
        <button class="btn pri" id="send">Send to Discord</button>
      </div>
    </div>

    <details class="card">
      <summary>Discord settings</summary>
      <div class="in">
        <label><span>Webhook URL</span><input type="url" id="hook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off"></label>
        <label><span>Password for encryption</span><input type="password" id="pw" autocomplete="new-password"></label>
        <label><span>Part size in MB</span><input type="number" id="mb" min="1" max="100" step="0.5" value="9.5"></label>
        <p class="small">Your password never leaves this device and isn’t saved. Without it, the parts can’t be opened.</p>
      </div>
    </details>
  </section>

  <section id="lockV" class="wrap" style="padding:0" hidden>
    <div class="card">
      <h2>Unlock a session</h2>
      <p class="small">Download all the .enc parts from Discord, select them together, and enter the password you used.</p>
      <label><span>Encrypted parts</span><input type="file" id="files" accept=".enc" multiple></label>
      <label><span>Password</span><input type="password" id="pw2" autocomplete="current-password"></label>
      <button class="btn pri" id="unlock">Unlock and merge</button>
      <p class="small" id="say2" aria-live="polite"></p>
      <video id="pv" controls playsinline hidden></video>
      <button class="btn" id="sv" hidden>Save merged video</button>
    </div>
  </section>
</main>

<div id="dim" aria-hidden="false">
  <div class="pill"><b></b><span id="t2">00:00:00</span></div>
  <button class="btn" id="stop2">Stop recording</button>
</div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const fmt=s=>pad(s/3600|0)+':'+pad(s/60%60|0)+':'+pad(s%60);
const say=t=>{$('#say').textContent=t};
const say2=t=>{$('#say2').textContent=t};
const stamp=()=>{const d=new Date();return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())};
let stream,rec,parts=[],blob,t0,dur=0,tk,lock,ext='webm',peekT,merged;

try{$('#hook').value=localStorage.getItem('hook')||'';$('#mb').value=localStorage.getItem('mb')||'9.5'}catch(e){}
const keep=()=>{try{localStorage.setItem('hook',$('#hook').value.trim());localStorage.setItem('mb',$('#mb').value)}catch(e){}};
$('#hook').onchange=$('#mb').onchange=keep;

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['recV','lockV'].forEach(id=>$('#'+id).hidden=id!==b.dataset.v);
});

$('#rec').onclick=()=>rec&&rec.state==='recording'?stop():start();
$('#stop2').onclick=stop;
$('#dim').onclick=e=>{
  if(e.target.id==='stop2')return;
  const d=$('#dim');d.classList.add('peek');clearTimeout(peekT);peekT=setTimeout(()=>d.classList.remove('peek'),3000);
};

async function start(){
  const au=$('#mic').checked,md=navigator.mediaDevices;
  try{stream=await md.getUserMedia({video:{facingMode:{exact:'user'}},audio:au})}
  catch(e){
    try{
      const cams=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput');
      const fr=cams.find(d=>/front|user|selfie/i.test(d.label));
      stream=await md.getUserMedia({video:fr?{deviceId:{exact:fr.deviceId}}:{facingMode:'user'},audio:au});
    }catch(e2){say('Camera access is blocked. Allow it in your browser’s site settings, then try again.');return}
  }
  $('#cam').srcObject=stream;$('#cam').play().catch(()=>{});
  const mt=['video/webm;codecs=vp9,opus','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  ext=mt.includes('mp4')?'mp4':'webm';
  rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:7e5}:{});
  parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};
  rec.onstop=finish;rec.start(5000);
  try{lock=await navigator.wakeLock.request('screen')}catch(e){}
  t0=Date.now();
  tk=setInterval(()=>{$('#t').textContent=$('#t2').textContent=fmt((Date.now()-t0)/1000|0)},500);
  document.body.classList.add('live');
  $('#done').hidden=true;
  say('Recording. Settle in and get to work.');
  if($('#dimOn').checked)document.body.classList.add('dim');
}

function stop(){
  if(!rec||rec.state!=='recording')return;
  dur=(Date.now()-t0)/1000|0;
  rec.stop();stream.getTracks().forEach(t=>t.stop());
  clearInterval(tk);if(lock)lock.release().catch(()=>{});
  document.body.classList.remove('live','dim');
}

function finish(){
  blob=new Blob(parts,{type:rec.mimeType||'video/webm'});
  const mb=blob.size/1e6,size=(+$('#mb').value||9.5);
  $('#info').textContent=fmt(dur)+' recorded, '+mb.toFixed(1)+' MB, about '+Math.max(1,Math.ceil(mb/size))+' parts on Discord.';
  $('#fill').style.width='0';$('#done').hidden=false;
  say('Session finished. Save it or send it to Discord.');
}

function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
$('#save').onclick=()=>dl(blob,'study-'+stamp()+'.'+ext);

async function deriveKey(pw,salt){
  const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:2e5,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}

$('#send').onclick=async()=>{
  const url=$('#hook').value.trim(),pw=$('#pw').value,size=Math.round(Math.max(1,+$('#mb').value||9.5)*1e6);
  if(!/^https:\/\/(discord|discordapp)\.com\/api\/webhooks\//.test(url))return say('Paste your Discord webhook URL in Discord settings first.');
  if(pw.length<8)return say('Choose a password of at least 8 characters in Discord settings. You need it to unlock the parts.');
  keep();
  const btn=$('#send');btn.disabled=true;
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(pw,salt);
  const n=Math.ceil(blob.size/size),id='study-'+stamp();
  for(let i=0;i<n;i++){
    say('Encrypting and sending part '+(i+1)+' of '+n+'…');
    const plain=await blob.slice(i*size,(i+1)*size).arrayBuffer(),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
    const out=new Uint8Array(28+ct.length);out.set(salt);out.set(iv,16);out.set(ct,28);
    const name=id+'-'+ext+'-part'+pad(i+1)+'of'+pad(n)+'.enc';
    for(let tries=0;;tries++){
      const fd=new FormData();
      fd.append('content',id+' part '+(i+1)+'/'+n);
      fd.append('files[0]',new Blob([out]),name);
      let r;
      try{r=await fetch(url+'?wait=true',{method:'POST',body:fd})}
      catch(e){btn.disabled=false;return say('Couldn’t reach Discord. Check your connection and the webhook URL, then send again.')}
      if(r.ok)break;
      if(r.status===429&&tries<5){
        const j=await r.json().catch(()=>({}));
        await new Promise(s=>setTimeout(s,(j.retry_after||2)*1000+300));continue;
      }
      btn.disabled=false;
      return say('Discord refused part '+(i+1)+' (error '+r.status+'). If the file is too large, lower the part size.');
    }
    $('#fill').style.width=((i+1)/n*100)+'%';
  }
  btn.disabled=false;
  say('All '+n+' parts are on your server. Keep your password safe.');
};

$('#unlock').onclick=async()=>{
  const fs=[...$('#files').files],pw=$('#pw2').value;
  const re=/^(.*)-(webm|mp4)-part(\d+)of(\d+)\.enc$/,pn=f=>+(f.name.match(re)||[])[3]||0;
  if(!fs.length||!pw)return say2('Select the .enc parts and enter the password.');
  const m=fs[0].name.match(re);
  if(!m)return say2('These files don’t look like parts made by this app.');
  if(fs.length!==+m[4])return say2('Expected '+m[4]+' parts but got '+fs.length+'.');
  fs.sort((a,b)=>pn(a)-pn(b));
  say2('Unlocking…');
  try{
    let key;const out=[];
    for(const f of fs){
      const b=new Uint8Array(await f.arrayBuffer());
      key=key||await deriveKey(pw,b.slice(0,16));
      out.push(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},key,b.slice(28)));
    }
    merged={b:new Blob(out,{type:'video/'+m[2]}),n:m[1]+'.'+m[2]};
    $('#pv').src=URL.createObjectURL(merged.b);$('#pv').hidden=false;$('#sv').hidden=false;
    say2('Done. Your video is ready.');
  }catch(e){say2('Wrong password, or a part is damaged.')}
};
$('#sv').onclick=()=>merged&&dl(merged.b,merged.n);
</script>
</body>
</html>
